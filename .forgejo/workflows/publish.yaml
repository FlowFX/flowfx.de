name: Build and publish to Codeberg Pages
on:
  push:
    branches: [main]
jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build Hugo site
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.169.0/hugo_0.169.0_linux-amd64.tar.gz
          tar -xzf hugo_0.169.0_linux-amd64.tar.gz
          ./hugo --baseURL https://flowfx.de
      - name: Push to flowfx.de
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://flowfx.de/
          server: codeberg.page
          token: ${{ forge.token }}
          source: public/
      - name: Push empty page to www.flowfx.de
        uses: https://www.org/git-pages/action@v2
        with:
          site: https://www.flowfx.de/
          server: codeberg.page
          token: ${{ forge.token }}
          source: public_redirect/
